<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Smart Factory Walkthrough</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <script src="vendor/gsap.min.js"></script>
</head>
<body>
  <div id="stage"></div>

  <header id="topbar">
    <button id="menuBtn" class="icon" aria-label="Zones">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand"><span class="logo"></span><h1 data-i18n="title">Smart Factory Walkthrough</h1></div>
    <div class="seg" role="group">
      <button id="playBtn"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span data-i18n="present">Auto-play</span></button>
      <button id="exploreBtn"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm3.5 5.5l-2 5-5 2 2-5z"/></svg><span data-i18n="explore">Free explore</span></button>
    </div>
    <div class="actions">
      <button id="labelsBtn" class="tbtn"><svg viewBox="0 0 24 24"><path d="M3 12l9-9h8v8l-9 9zM15.5 6.5h.01"/></svg><span class="v">Show all devices</span></button>
      <button id="xrayBtn" class="tbtn"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg><span data-i18n="xray">X-ray</span></button>
      <button id="langBtn" class="tbtn lang" aria-label="Language"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="v">TH</span></button>
    </div>
  </header>

  <nav id="sidebar">
    <div class="side-h" data-i18n="zones">Zones</div>
    <ol id="sceneList"></ol>
    <p class="hint" data-i18n="hint">Hover or tap a device to see details</p>
  </nav>
  <div id="scrim"></div>

  <section id="caption">
    <button id="capToggle" class="cap-toggle" aria-label="Collapse"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="kicker" id="capKicker"></div>
    <h2 id="capTitle"></h2>
    <p id="capText"></p>
    <ol id="capSteps"></ol>
    <div id="capDevices"></div>
    <div class="ctrl">
      <button id="prevBtn" class="icon" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="ppBtn" class="icon pp" aria-label="Play"></button>
      <button id="nextBtn" class="icon" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div id="progress"><i></i></div>
    </div>
  </section>

  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mName">
    <article class="card">
      <button id="mClose" class="icon close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="media">
        <img id="mImg" alt="">
        <div id="mPh" class="ph" hidden>
          <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4"/></svg>
          <span data-i18n="imagePlaceholder">Image placeholder — add file:</span>
          <code></code>
        </div>
        <small id="mCredit"></small>
      </div>
      <div class="body">
        <div class="tags"><span id="mZone" class="zone"></span><span id="mBrand" class="brand-tag" hidden></span></div>
        <h3 id="mName"></h3>
        <p id="mFunc" class="func"></p>
        <h4 data-i18n="howItWorks">How it works</h4>
        <ol id="mHow" class="how"></ol>
        <div class="pr">
          <div class="p"><h5 data-i18n="problem">Problem</h5><p id="mProblem"></p></div>
          <div class="arrow">→</div>
          <div class="r"><h5 data-i18n="result">Result</h5><p id="mResult"></p></div>
        </div>
      </div>
    </article>
  </div>

  <div id="loading"><div class="spin"></div><span>Loading factory…</span></div>
  <div id="fps" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
