<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brake Booster Line 3D</title>
  <style>
:root {
  --bg: #0b1220;
  --panel: rgba(13, 20, 36, 0.86);
  --line: rgba(148, 163, 184, 0.22);
  --text: #e5ecf6;
  --muted: #94a3b8;
  --done: #22c55e;
  --plan: #f59e0b;
  --accent: #38bdf8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Leelawadee UI", sans-serif; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; }

#topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px; background: linear-gradient(180deg, rgba(8,13,25,.95), rgba(8,13,25,.6));
  border-bottom: 1px solid var(--line); z-index: 5; }
.brand .title { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.brand .sub { color: var(--muted); font-size: 12px; }
.tools { display: flex; gap: 8px; }
.pill { background: rgba(56,189,248,.12); color: var(--text); border: 1px solid rgba(56,189,248,.45);
  border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
.pill:hover { background: rgba(56,189,248,.25); }
.pill.on { background: var(--accent); color: #031525; }

#sidebar { position: fixed; top: 68px; left: 12px; width: 268px; max-height: calc(100% - 80px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; z-index: 4;
  backdrop-filter: blur(8px); }
#sidebar .group { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--done); margin: 6px 6px 4px; }
#sidebar .group.plan { color: var(--plan); margin-top: 12px; }
#sidebar .group:nth-of-type(3) { color: var(--muted); margin-top: 12px; }
#sidebar ol { list-style: none; margin: 0; padding: 0; }
#sidebar li { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
#sidebar li:hover { background: rgba(148,163,184,.12); }
#sidebar li.active { background: rgba(56,189,248,.18); outline: 1px solid rgba(56,189,248,.5); }
#sidebar .num { flex: 0 0 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
  font-size: 12px; background: var(--done); color: #052e14; }
#sidebar .num.plan { background: var(--plan); color: #3b2300; }
#sidebar .num.misc { background: #475569; color: #fff; }

#caption { position: fixed; left: 292px; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 16px; z-index: 4; backdrop-filter: blur(8px); max-height: 38%; overflow: auto; }
.cap-head { display: flex; align-items: center; gap: 10px; }
.cap-head h2 { margin: 0; font-size: 18px; }
.tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--done); color: #052e14; white-space: nowrap; }
.tag.plan { background: var(--plan); color: #3b2300; }
.tag.misc { background: #475569; color: #fff; }
#capText { margin: 6px 0 4px; color: #cbd5e1; }
#capPoints { margin: 0; padding-left: 18px; color: var(--muted); columns: 2; column-gap: 28px; }
#capPoints li { break-inside: avoid; margin-bottom: 2px; }
.cap-nav { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 6px; }
#capStep { color: var(--muted); font-size: 12px; }

/* 3D labels */
.lbl { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px;
  border-radius: 999px; background: rgba(8,13,25,.82); border: 1px solid rgba(34,197,94,.7); color: #fff;
  font-size: 12px; font-weight: 600; white-space: nowrap; transition: opacity .3s, transform .3s; transform-origin: center bottom; }
.lbl b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--done); color: #052e14; font-size: 11px; }
.lbl.plan { border-color: rgba(245,158,11,.8); border-style: dashed; }
.lbl.plan b { background: var(--plan); color: #3b2300; }
.lbl.small { padding: 2px 8px; font-weight: 500; font-size: 11px; border-color: rgba(148,163,184,.5); background: rgba(8,13,25,.65); }
.lbl.dim { opacity: .35; transform: scale(.9); }
.lbl.focus { opacity: 1; transform: scale(1.12); box-shadow: 0 0 0 3px rgba(56,189,248,.35); }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; color: var(--muted);
  transition: opacity .5s; }
#loading.hide { opacity: 0; pointer-events: none; }

@media (max-width: 760px) {
  #topbar { height: 50px; padding: 0 12px; }
  .brand .sub { display: none; }
  .brand .title { font-size: 14px; }
  #sidebar { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: none; border-radius: 0; padding: 6px 8px;
    display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; }
  #sidebar .group { display: none; }
  #sidebar ol { display: flex; gap: 4px; }
  #sidebar li { padding: 4px; }
  #sidebar li span:not(.num) { display: none; }
  #caption { left: 8px; right: 8px; bottom: 50px; padding: 10px 12px; max-height: 42%; }
  .cap-head h2 { font-size: 15px; }
  #capPoints { display: none; }
  .pill { padding: 4px 10px; white-space: nowrap; font-size: 12px; }
  .lbl { font-size: 10px; }
  .lbl span { display: none; }
}

</style>
  </head>
<body>
  <div id="app"></div>

  <header id="topbar">
    <div class="brand">
      <div class="title" data-i18n="title"></div>
      <div class="sub" data-i18n="subtitle"></div>
    </div>
    <div class="tools">
      <button id="btnTour" class="pill" data-i18n="tour"></button>
      <button id="btnLang" class="pill">TH</button>
    </div>
  </header>

  <nav id="sidebar">
    <div class="group" data-i18n="delivered"></div>
    <ol id="listDone"></ol>
    <div class="group plan" data-i18n="roadmap"></div>
    <ol id="listPlan"></ol>
    <div class="group" data-i18n="views"></div>
    <ol id="listMisc"></ol>
  </nav>

  <section id="caption">
    <div class="cap-head">
      <span id="capTag" class="tag"></span>
      <h2 id="capTitle"></h2>
    </div>
    <p id="capText"></p>
    <ul id="capPoints"></ul>
    <div class="cap-nav">
      <button id="btnPrev" class="pill">‹</button>
      <span id="capStep"></span>
      <button id="btnNext" class="pill">›</button>
    </div>
  </section>

  <div id="loading">Loading 3D…</div>
