<!doctype html><html><body style="margin:0;background:#bbb">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W=1200,H=800;
const r = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); document.body.appendChild(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;
const sc = new THREE.Scene(); sc.background=new THREE.Color(0xcccccc);
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment()).texture;
sc.add(new THREE.DirectionalLight(0xffffff,2).translateY(10).translateX(5));
const l=new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const g = await l.loadAsync(q.get('f'));
const o=g.scene; sc.add(o);
const filt=q.get('node'); if(filt){ o.traverse(n=>{ if(n.isMesh) n.visible = n.name.includes(filt) || [...(function*(x){while(x){yield x.name;x=x.parent}})(n)].some(s=>s.includes(filt)); }); }
const b=new THREE.Box3().setFromObject(o,true); const s=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3());
window.info={size:s.toArray(),min:b.min.toArray(),max:b.max.toArray()};
const R=s.length()*0.75;
const views=[[1,0.5,1],[-1,0.5,-1],[0,0,1],[1,0,0],[0,0,-1],[-1,0,0]];
const cam=new THREE.PerspectiveCamera(40,W/H*1,0.01,R*10);
const out=[];
r.setScissorTest(true);
const cols=3, rows=2, w=W/cols, h=H/rows; cam.aspect=w/h; cam.updateProjectionMatrix();
views.forEach((v,i)=>{ cam.position.copy(c).add(new THREE.Vector3(...v).normalize().multiplyScalar(R*1.3)); cam.lookAt(c);
 const x=(i%cols)*w, y=H-(Math.floor(i/cols)+1)*h; r.setViewport(x,y,w,h); r.setScissor(x,y,w,h); r.render(sc,cam);});
window.done=true;
</script></body></html>
